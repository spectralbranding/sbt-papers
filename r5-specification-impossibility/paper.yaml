- claim_id: P4
  criterion: Holds if (Theorem 2, Effective Dimensionality Reduction) OST's cascade model, where level
    i constrains level i+1 with strength gamma, reduces effective dimensionality to d_eff = 8(1-(1-gamma)^6)/gamma
    — 15.
  falsification: Lemma 1 falsified if measured per-level effective dimensionality at gamma=0.5 deviates
    systematically from d_i = 8·0.5^i (e.g. L2 freedom substantially above 2.0), indicating the uniform-gamma
    model fails.
- claim_id: P5
  criterion: 'Holds if (Proposition 1, Coherence–Coupling Correspondence) The closed form converts to
    a falsifiable empirical prediction: the cross-level coherence ratio R = 1 - d_eff/(nL) is a monotone
    increasing function R(gamma) of cascade coupling, so across organizations an estimated R_hat should
    track R(gamma_hat) within a tolerance band (anchors R(.'
  falsification: 'The earlier correlation clause is withdrawn as circular: the only d_eff estimator this
    paper supplies is P4''s closed form in gamma, so R_hat = 1 - d_eff(gamma_hat)/48 equals R(gamma_hat)
    identically and r = 1 for every sample, including pure noise. Restated: falsified if R_hat_o computed
    from a d_eff estimate INDEPENDENT of gamma_hat — the participation ratio (sum lambda_i)^2 / sum lambda_i^2
    of the measured 48-parameter covariance spectrum, or a manifold intrinsic-dimension estimator on the
    same matrices — correlates below .50 with R(gamma_hat) across organizations, or if the residuals R_hat_o
    - R(gamma_hat_o) depend systematically on level (per-pair gamma differing by >.20 within one organization).
    The second clause was always testable and does not depend on the first, because per-pair gamma estimates
    are separate measurements rather than one closed form evaluated twice.'
- claim_id: P8
  criterion: Holds if (Information-theoretic reading) A full 48-dim specification carries H_48 = 48·log2(10)
    ≈ 159.
  falsification: 'The earlier clause (a) — "falsified if a full specification''s effective information
    is substantially below 23 bits" — is withdrawn as unreachable under the model''s own floor: L0 contributes
    8 free dimensions at every gamma, so d_eff >= 8 and H_eff >= 26.6 bits, above the 23.2-bit capacity
    by construction. Restated with a reachable target: the chunk identification fails if the number of
    independently varying activation parameters at L0 is measured at 6 or fewer across organizations,
    since H_eff would then be at most 19.9 bits and no compression would be needed. The necessity claim
    fails if designers given the same 48-parameter task with and without a cascade scaffold — both with
    full access to external representations — produce specifications of indistinguishable completeness
    and internal consistency on a rubric fixed in advance, or if organizations are observed producing
    coherent full-dimensional specifications with no cascade or fork structure.'
