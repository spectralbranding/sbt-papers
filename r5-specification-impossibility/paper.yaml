  statement: '(Information-theoretic reading) A full 48-dim specification carries H_48 = 48·log2(10) ≈
    159.4 bits against a working-memory capacity of ≈23.2 bits (Miller) or ≈13.3 (Cowan). The comparison
    is a DERIVATION, not a measurement: log2(1/epsilon) cancels from both sides, so the ratio is exactly
