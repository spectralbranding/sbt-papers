meta:
  title: 'The Label Moves the Reading: Entity-Name Leakage in Language-Model Dimensional Ratings of a
    Fixed Text'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.22161305
  date: '2026-08-29'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - language models
  - measurement validity
  - dimensional rating
  - entity effects
  - name bias
  - instrument diagnostics
  - pre-registration
  abstract: 'A dimensional rating produced by a language model over a written artifact is normally treated
    as a reading of that artifact. This study shows it is not purely that. Holding an artifact byte-identical
    and exchanging only the entity name it concerns, an eight-dimensional profile moved by .55 to .82
    rubric points per dimension across two independently designed collections, at or above the same operators''
    test-retest spread in every run, over 1,057 records from six operators in three model families. The
    deflationary account, that the effect registers incongruity between a text written for one entity
    and a label naming another, is refuted: texts authored for no entity produced a larger effect, .824
    against .584. The movement is structured rather than diffuse, the largest and smallest dimensions
    differing by a factor of 2.4 with both extremes reproducing across runs. Which of three routes carries
    the leakage is not identified, and the study reports why. A re-analysis shows the guard that blocked
    the decomposition referred its interaction to the entity main effect rather than the within-cell residual;
    referred correctly, the interaction is roughly five percent of residual. The exchange procedure is
    offered as a diagnostic for other rubric instruments.'
claims:
- id: P1
  type: proposition
  statement: 'A language model''s dimensional rating of a written artifact is not a pure function of that
    artifact: the entity the artifact is said to concern carries a measurable share of the rating.'
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P2
  type: proposition
  statement: A byte-identical name exchange, paired with a blind recovery probe that asks whether the
    original entity is still identifiable from the text, is a reusable procedure for measuring how much
    of any rubric instrument's reading is carried by the label rather than by the rated material.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: A neutrality guard that refers a text-by-entity interaction to the entity main effect rather
    than to the within-cell residual can return a blocking verdict when the interaction is small, because
    the reference quantity moves with the main effect and with replicate count while the interaction does
    not.
  testable: true
  tested_in_paper: true
  status: not_tested
methodology:
  type: mixed
  design: 'Per-dimension name-exchange magnitude: Euclidean distance between two entities'' profiles over
    the same text and operator, divided by the square root of the number of dimensions. Test-retest normalisation:
    the same operator''s spread over repeat presentations of an identical prompt, used as the yardstick
    against which a name-exchange magnitude is judged large or small. Weighted two-way text-by-class decomposition
    of the name-exchange magnitudes, with the interaction mean square referred to the WITHIN-CELL residual
    mean square rather than to the class effect.'
  analysis:
    software: name_effect_probe/code/stats_core.py
    method: Python 3.12
acceptance:
- claim_id: P1
  criterion: 'Holds if a language model''s dimensional rating of a written artifact is not a pure function
    of that artifact: the entity the artifact is said to concern carries a measurable share of the rating.'
  falsification: A name exchange over byte-identical text that leaves the profile within the same operators'
    replicate spread.
- claim_id: P2
  criterion: Holds if a byte-identical name exchange, paired with a blind recovery probe that asks whether
    the original entity is still identifiable from the text, is a reusable procedure for measuring how
    much of any rubric instrument's reading is carried by the label rather than by the rated material.
  falsification: The procedure returning a non-zero leakage estimate on an instrument constructed so that
    the label cannot enter, which would show the estimate measures something other than leakage.
- claim_id: P3
  criterion: Holds if a neutrality guard that refers a text-by-entity interaction to the entity main effect
    rather than to the within-cell residual can return a blocking verdict when the interaction is small,
    because the reference quantity moves with the main effect and with replicate count while the interaction
    does not.
  falsification: A demonstration that the two denominators order designs identically, which would make
    the choice immaterial.
