limitations:
- description: The route carrying the leakage is unidentified, and the paper does not claim otherwise.
  severity: major
  addressable: true
- description: The first collection's contrasts each paired a prevalent real entity against an invented
    one, so that collection alone cannot separate what the model knows about an entity from the unfamiliarity
    of an invented name.
  severity: moderate
  addressable: true
- description: Nine names in one domain; whether the magnitude transfers to other categories is untested.
  severity: moderate
  addressable: true
- description: No human comparison was collected, so the size of the effect cannot be compared against
    what a label does to a person reading the same text.
  severity: moderate
  addressable: true
- description: Whether the exchanged name removes what the model knows has not yet been measured, so the
    reported magnitudes may be lower bounds.
  severity: major
  addressable: true
- description: The operator pool is drawn from commercially served models rather than open-weight ones,
    so the instrument cannot be versioned or inspected by the researcher, and whether the effect survives
    on a pool that can be is untested.
  severity: moderate
  addressable: true
- description: The harness logs responses but not token probabilities, so the reading's uncertainty cannot
    be modelled from the released records, only its location.
  severity: minor
  addressable: true
