  - id: m3
    statement: "Second collection, per-dimension name-exchange magnitude: .824 and .825 across two runs."
    source_observations: [O2]
    generating_method: M1
    value: ".824 / .825"
    uncertainty: "two independent runs, agreeing to three decimal places"
    units: "rubric points per dimension"
    provenance: {created_by: "author", created_at: "2026-08-26T00:00:00Z"}

  - id: m4
    statement: "Second collection, the same magnitude in test-retest units: 1.152 and 1.092."
    source_observations: [O2]
    generating_method: M2
    value: "1.152 / 1.092"
    uncertainty: "two independent runs reported separately"
    units: "multiples of the instrument's own replicate spread"
    provenance: {created_by: "author", created_at: "2026-08-26T00:00:00Z"}

  - id: m5
