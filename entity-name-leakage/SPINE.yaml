      .492 / .583, narrative .490 / .466, ideological .360 / .353.
    source_observations: [O2]
    generating_method: M5
    value: "max/min ratio 2.39 and 2.38; range .499 and .486 rubric points"
    uncertainty: "two independent runs reported separately; both extremes agree across runs"
    units: "rubric points per dimension"
    provenance: {created_by: "author", created_at: "2026-08-29T00:00:00Z"}

  - id: m8
    statement: >-
      Second collection, 864 records per run: aggregate mean .824 with 95% CI
      [.793, .855] in run 1 and .825 with [.794, .856] in run 2; variance shares
