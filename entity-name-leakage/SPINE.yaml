# SPINE.yaml — Entity-Name Leakage in Language-Model Dimensional Readings (2026bp)
#
# GENERATIVE spine, authored BEFORE paper.md prose per
# SPINE_FIRST_DRAFTING_PROTOCOL.md. Every prose claim in paper.md traces to a
# node here. EMPIRICAL paper over author-collected instrument records, so v0.2
# (observation -> method -> measurement -> finding -> proposition).
#
# The paper reports what is ESTABLISHED and pre-registers what is not. F1 and F2
# are in hand. F3 records that the route decomposition is NOT identified, and F4
# records why the verdict that blocked it does not mean what it appeared to mean.
# A3-A5 stay OPEN by design; a paper that closed them here would be overclaiming.
#
# or review-process meta. Authoring provenance lives in per-node
# provenance.source_log_event and in authoring_notes / changelog, both dropped on
# public export.

spine_version: "0.2"
spine_doc_version: "0.1.0"
schema_version: "0.2"
paper_key: "2026bp"
provenance_mode: empirical
title: >-
  The Label Moves the Reading: Entity-Name Leakage in Language-Model
  Dimensional Ratings of a Fixed Text

thesis: >-
  A dimensional rating produced by a language model over a written artifact is
  normally treated as a reading OF that artifact. It is not purely that. With
  the artifact text held byte-identical and only the entity name exchanged, the
  eight-dimensional profile moves by an amount at or above the instrument's own
  test-retest spread, and the movement reproduces across two independently
  designed collections. The most obvious deflationary account — that the effect
  is incongruity between a text written for one entity and a label naming
  another — is refuted by the second collection, whose texts were authored for
  no entity and which returned a LARGER effect. Which of three routes carries
  the leakage is NOT settled here, and the paper says so: the collected design
  can bound the text-by-entity interaction only to an upper limit too loose to
  license the decomposition. The measurement procedure is offered as a
  diagnostic any rubric instrument can be put through.

stylized_facts:
  - id: SF1
    statement: >-
      A language model's dimensional rating of a fixed text is partly a function
      of the entity the text is said to be about, rather than of the text alone.
    aggregates_findings: [F1, F2]
    aggregation_logic: >-
      F1 establishes the effect and its reproduction across two designs; F2
      removes the one account under which the effect would have been an artifact
      of the first design's stimuli.
    uniquely_explained_by: >-
      No account on which the rating is a pure function of the rated text can
      produce a non-zero effect, because the text is byte-identical across the
      contrast.
    body_sections: ["Results — The effect"]
    provenance:
      created_by: "author"
      created_at: "2026-08-29T00:00:00Z"

observations:
  - id: O1
    statement: >-
      Instrument records from the first collection's name-exchange arm, four
      artifact texts each paired with a prevalent real entity and an invented
      one, two independent runs.
    raw_data_pointer: "prevalence_probe/data/run{1,2}/records_*.jsonl"
    instrument: "eight-dimensional scored rubric administered to six operators across three model families"
    timestamp: "2026-08-26T00:00:00Z"
    conditions_at_capture: "frozen protocol and stimulus pack; operator pins literal; zero failures"
    provenance:
      created_by: "author"
      created_at: "2026-08-26T00:00:00Z"
    body_sections: ["Method — Collections"]

  - id: O2
    statement: >-
      Instrument records from the second collection's name-exchange arm, nine
      entities across three prevalence strata crossed with four artifact texts
      authored for no entity, six operators, two independent runs, 864 records.
    raw_data_pointer: "name_effect_probe/data/run{1,2}/records_*.jsonl"
    instrument: "eight-dimensional scored rubric administered to six operators across three model families"
    timestamp: "2026-08-26T00:00:00Z"
    conditions_at_capture: "frozen protocol and stimulus pack; all six operators passed floors in both runs; zero failures"
    provenance:
      created_by: "author"
      created_at: "2026-08-26T00:00:00Z"
    body_sections: ["Method — Collections"]

methods:
  - id: M1
    statement: >-
      Per-dimension name-exchange magnitude: Euclidean distance between two
      entities' profiles over the same text and operator, divided by the square
      root of the number of dimensions.
    type: "statistical_analysis"
    inputs: [O1, O2]
    outputs: [m1, m2, m3, m4]
    code_anchor: "name_effect_probe/code/stats_core.py"
    reproducibility:
      seed: "deterministic (no RNG)"
      version: "frozen; checksummed in the collection's freeze record"
      runtime_environment: "Python 3.12"
    provenance:
      created_by: "author"
      created_at: "2026-08-26T00:00:00Z"
    body_sections: ["Method — The magnitude"]

  - id: M2
    statement: >-
      Test-retest normalisation: the same operator's spread over repeat
      presentations of an identical prompt, used as the yardstick against which
      a name-exchange magnitude is judged large or small.
    type: "statistical_analysis"
    inputs: [O1, O2]
    outputs: [m2, m4]
    code_anchor: "name_effect_probe/code/stats_core.py"
    reproducibility:
      seed: "deterministic (no RNG)"
      version: "frozen; checksummed in the collection's freeze record"
      runtime_environment: "Python 3.12"
    provenance:
      created_by: "author"
      created_at: "2026-08-26T00:00:00Z"
    body_sections: ["Method — The yardstick"]

  - id: M3
    statement: >-
      Weighted two-way text-by-class decomposition of the name-exchange
      magnitudes, with the interaction mean square referred to the WITHIN-CELL
      residual mean square rather than to the class effect.
    type: "statistical_analysis"
    inputs: [O2]
    outputs: [m5]
    code_anchor: "phase2_power/estimate_guard_ratio.py"
    reproducibility:
      seed: "deterministic (no RNG)"
      version: "validated against the collection's own published aggregate before reporting"
      runtime_environment: "Python 3.12 + numpy + pyyaml"
    provenance:
      created_by: "author"
      created_at: "2026-08-29T00:00:00Z"
    body_sections: ["Results — What the guard was measuring"]

  - id: M5
    statement: >-
      Per-dimension decomposition of the name-exchange movement, validated by
      requiring the root mean square over dimensions to reproduce the reported
      aggregate before any per-dimension value is emitted.
    type: "statistical_analysis"
    inputs: [O2]
    outputs: [m7]
    code_anchor: "phase2_power/per_dimension_leakage.py"
    reproducibility:
      seed: "deterministic (no RNG)"
      version: "validated against the collection's own aggregate before reporting"
      runtime_environment: "Python 3.12 + numpy"
    provenance:
      created_by: "author"
      created_at: "2026-08-29T00:00:00Z"
    body_sections: ["Results — The leakage is structured"]

  - id: M4
    statement: >-
      Monte Carlo of the sampling behaviour of the interaction-to-residual ratio
      at the measured value, sweeping the number of texts, to obtain the upper
      confidence limit a design of each size could defend.
    type: "simulation"
    inputs: [m5]
    outputs: [m6]
    code_anchor: "phase2_power/equivalence_power.py"
    reproducibility:
      seed: "20260829"
      version: "run twice; byte-identical output"
      runtime_environment: "Python 3.12 + numpy"
    provenance:
      created_by: "author"
      created_at: "2026-08-29T00:00:00Z"
    body_sections: ["Results — How tightly neutrality can be bounded"]

