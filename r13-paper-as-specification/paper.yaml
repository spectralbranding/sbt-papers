- id: P15
  type: proposition
  statement: 'The deliberate simplification of typed citation relationships to five does not survive sustained
    use. The vocabulary grew because authors needed distinctions the small set could not carry, and the
    growth proved nearly free: the great majority of the enlarged vocabulary already had standard published
    predicates waiting for it. The defensible position is therefore not to compete with the established
    citation and mapping vocabularies but to author in the researcher''s own terms and EMIT into them,
    reserving novel predicates for the few relations with no prior art.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
