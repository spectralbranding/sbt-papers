    reconciliation before either author has read the other's prose, with definitional identity decided
    mechanically by content-addressed hashing rather than by judgement. What this does not do is settle
    the semantic questions for the authors; whether two independent authors accept such proposals is a
    stated, falsifiable next experiment. The single-author corpus is the degenerate case in which the
    two parties are the same person at two times and the negotiation collapses to a rebase.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P4
- id: P18
  type: proposition
  statement: 'Approaches to machine-readable scientific knowledge divide by WHEN the structure is created
    and BY WHAT, not by how expressive the format is. Three positions are occupied. Harvest-time reconstruction
    builds the structure after publication, from the finished article, by annotators or extraction systems.
    Born-readable computation emits the structure during data analysis, from the computing environment
    that produced the result, by instrumenting the analysis itself. Author-time specification records
    the structure while the paper is written, from the author, about the argument. These are complements
    rather than rivals, because they can capture different things: an analysis pipeline can emit what
    it computed but cannot emit what would refute the claim or which cited work is a critical dependency,
    since neither is present in the computation; and an extraction system after the fact can recover neither.
    The layers compose, and a corpus wanting all three needs all three.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
- id: P19
  type: proposition
  statement: 'The claim that formal-semantic authoring is impractical for working researchers is too strong
    as usually stated, and the one field study that tested it says so. Authors given tool support did
    produce formal representations of their own claims, rated the underlying concept easy, rated the instantiation
    only moderately difficult, reported high confidence in what they had produced, and said they would
    do it again. What the study does not establish is generality: its participants were already fluent
    in knowledge representation and ontologies, so it demonstrates feasibility for a semantically literate
    population rather than for the median researcher. The defensible form of the adoption argument is
    therefore about the size of the population that can author a given format without training, not about
    whether formal authoring is possible at all. Notably, the same participants rated the human-readable
    rendering of their work as far more important to readers than the formal one, which is an argument
    for a machine-readable companion beside a human-readable paper rather than in place of it.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
- id: P20
  type: proposition
  statement: Author-side adoption of a specification standard is necessary but not sufficient, because
    the obstacle to reforming scholarly communication is a collective-action problem rather than a technical
    one. Proposals to replace the incumbent publishing system converge on community-governed open standards,
    substitutable service providers, and funder requirements that redirect institutional money toward
    open infrastructure. A standard authored by individuals therefore needs an institutional counterpart
    -- a governance body it does not itself constitute -- and its adoption path should be stated in those
    terms rather than as a purely voluntary diffusion curve.
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P12
- id: P21
  type: proposition
  statement: 'A specification standard can carry a materiality axis and still be unable to detect selective
    reporting, because the axis is attached to what a paper depends ON rather than to what it CLAIMS.
    In the operating corpus the criticality flag is live and heavily used across dependency edges, and
    limitations carry a severity, but the claim record has no materiality field at all: its status field
    records epistemic state -- active, draft, superseded, rejected -- which is a different axis altogether.
    A claim can be active, true, fully supported and entirely immaterial to the paper''s conclusion, and
    nothing in the record says so. Because dependency criticality is one of exactly two properties the
    comparison of standards names as distinguishing this one, the gap is not an omission but a mis-aimed
    contribution: selective reporting is a claims-side materiality failure, so the stack cannot detect
    it by construction rather than by oversight.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P4
  - P5
- id: P22
  type: proposition
  statement: 'The pattern in which the operating system grows a component the published stack does not
    contain has now recurred on a second and unrelated axis: retention. The store records a superseded
    epistemic status, and a substantial number of claims carry it, but none of the five published layers
    is a retention layer -- nothing in the stack requires that a claim which has been withdrawn or replaced
    remain visible and linked to what replaced it. Stated narrowly, the published stack has no retention
    layer although the store does. Because the same shape has now appeared twice on axes that have nothing
    to do with each other, it is better read as a property of specifying a standard and then operating
    it than as an incident of either axis.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P14
  - P21
methodology:
  type: empirical
  design: 'Paper Spec v0.1.0: a YAML 1.2 companion file validatable against a JSON Schema, with top-level
    keys spec_version + meta (required) and claims, methodology, acceptance, dependencies, results, limitations,
    contradictions, repositories, submission_history, computation (all optional). Claims carry stable,
    unique IDs; dependencies are typed (extends/applies/tests/contradicts/refines) and flagged critical:
    true|false; external references take the form doi:claim_id. The L0-L4 verification stack: L0 schema
    validation (deterministic, automated, reference implementation exists), L1 internal consistency (rules
    engine, no NLP), L2 completeness (paper.md vs paper.yaml, LLM-assisted, suggestions not verdicts),
    L3 plausibility (cross-document LLM first-pass filter, not a human replacement), L4 cross-corpus integrity
    (retraction-cascade, contradiction detection, dependency-graph traversal, claim-level semantic search
    over a corpus of paper.yaml files).'
  analysis:
    software: https://github.com/spectralbranding/sbt-papers/tree/main/r13-paper-as-specification
acceptance:
- claim_id: P6
  criterion: Holds if (Paper Proposition 1 -- Expressiveness) A paper.
  falsification: Falsified if inter-rater agreement between YAML-only and full-paper reconstruction falls
    below kappa = .70 in an independent multi-field pilot.
- claim_id: P7
  criterion: Holds if (Paper Proposition 2 -- Verification utility) Automated L1 (internal consistency)
    and L2 (completeness) checks over a corpus of paper.
  falsification: Falsified if L1/L2 checks flag genuine deficiencies in fewer than 60% of first-draft
    files authored by non-paper-authors.
- claim_id: P8
  criterion: Holds if (Paper Proposition 3 -- Dependency analysis) The dependency graph built from paper.
  falsification: Falsified if dependency-graph recall deviates from expert-coded retraction-impact sets
    by more than 20% on a gold-standard corpus with known retraction history.
- claim_id: P9
  criterion: Holds if (Paper Proposition 4 -- Cognitive value) The thirty-to-sixty-minute specification
    overhead is dominated by the cognitive work of articulating claims and acceptance criteria -- work
    that improves the paper itself; researchers writing paper.
  falsification: Falsified if fewer than 30% of researchers completing paper.yaml before submission independently
    identify at least one substantive issue not otherwise caught.
- claim_id: P13
  criterion: Holds if at corpus scale the manifest ceases to be the authored artifact and becomes a projection.
  falsification: If an independent author maintaining a comparable corpus continues to hand-author manifests
    at scale without adopting a generative upstream artifact, and reports no loss from doing so, the projection
    claim is a local artifact of this author's tooling rather than a property of the standard at scale.
- claim_id: P14
  criterion: Holds if the binding constraint on a specification layer for science is not verification
    of the claims but DRIFT between the specification and the prose it specifies.
  falsification: If a corpus maintained under L0-L4 alone shows no measurable accumulation of specification-prose
    divergence over a substantial number of edits, then drift is not the binding constraint and the additional
    gate is redundant.
- claim_id: P15
  criterion: Holds if the deliberate simplification of typed citation relationships to five does not survive
    sustained use.
  falsification: If an independently developed claim vocabulary of comparable size shows substantially
    lower coverage against the published predicate sets, the convergence is specific to this author's
    vocabulary rather than a general property, and competing rather than emitting remains defensible.
- claim_id: P16
  criterion: Holds if in an AI-mediated research economy a claim without instrument provenance is not
    a specified claim.
  falsification: If claims carrying full instrument provenance prove no more reproducible or auditable
    than otherwise-identical claims without it, provenance is metadata decoration rather than constitutive,
    and the field is optional.
- claim_id: P17
  criterion: Holds if the multi-author case has a specified mechanism rather than only an open question.
  falsification: If two independent authors, given the classified interactions and proposed reconciliations
    for their overlapping modules, reject or ignore the proposals at a rate indistinguishable from unaided
    negotiation, the mechanism adds no value over reading each other's papers.
- claim_id: P18
  criterion: Holds if approaches to machine-readable scientific knowledge divide by WHEN the structure
    is created and BY WHAT, not by how expressive the format is.
  falsification: If a born-readable pipeline is shown to emit acceptance criteria, falsification conditions
    and dependency criticality for a paper without the author supplying them separately, author-time specification
    is redundant rather than complementary and the division collapses.
- claim_id: P19
  criterion: Holds if the claim that formal-semantic authoring is impractical for working researchers
    is too strong as usually stated, and the one field study that tested it says so.
  falsification: If a comparable field study drawn from a population with no prior knowledge-representation
    background reports the same feasibility and willingness-to-repeat, the literacy qualification is unnecessary
    and the adoption argument must rest on authoring cost alone.
- claim_id: P21
  criterion: Holds if a specification standard can carry a materiality axis and still be unable to detect
    selective reporting, because the axis is attached to what a paper depends ON rather than to what it
    CLAIMS.
  falsification: If an independent coder, given only a paper's claim records with their epistemic status
    together with its dependency criticality flags, can identify which of that paper's reported claims
    are immaterial to its conclusion at agreement substantially above chance, then materiality is recoverable
    from what the standard already records and no claims-side axis is needed.
- claim_id: P22
  criterion: 'Holds if the pattern in which the operating system grows a component the published stack
    does not contain has now recurred on a second and unrelated axis: retention.'
  falsification: If a systematic comparison of the operating corpus's components against the five published
    layers finds that the remaining components map onto L0-L4 without residue, then the drift gate and
    the retention gap are two incidents rather than a pattern, and the generalization is unsupported.
