- id: P14
  type: proposition
  statement: The binding constraint on a specification layer for science is not verification of the claims
    but DRIFT between the specification and the prose it specifies. This has no analogue in the software
    pipeline the L0-L4 stack was modelled on, because in software the source is the artifact, whereas
    a specified paper is two artifacts that can silently diverge. An anti-drift gate -- a check that the
    bundle and its substrate still agree, run on every edit and failing the build on hard drift -- is
    therefore a necessary sixth component, not an implementation detail of the five layers.
  testable: true
  tested_in_paper: true
