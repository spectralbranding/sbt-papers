limitations:
- description: 'The paper is theoretical: the four propositions are stated but not tested, and there is
    no adoption data. Empirical validation requires a multi-author, multi-field pilot.'
  severity: moderate
  addressable: true
- description: 'The twenty-paper demonstration is single-author, single-program: the author had complete
    access to ground truth and is maximally motivated and informed (the easiest possible case), so it
    cannot test adoption, the thirty-six-minute average may not generalize, and the dependency structure
    is unusually rich because the papers were designed as a coherent program. The falsification-gap finding
    is suggestive but any structured reflection (a checklist, a colleague conversation) might produce
    similar discoveries; Paper Spec''s distinctive value (machine-readability + cumulative network effects)
    cannot be shown on a self-authored corpus.'
  severity: moderate
  addressable: true
- description: Theoretical papers are overrepresented (fifteen of twenty); expressiveness for empirical,
    computational, and meta-analytic work, and for fields with complex statistical designs or non-standard
    methodologies, is demonstrated only narrowly and may require extensions to the standard.
  severity: moderate
  addressable: true
- description: 'No institutional validation: it is untested whether journals would accept paper.yaml as
    supplementary material, whether repositories would index it, or whether reviewers would use it --
    and the standard is at v0.1.0, so field names and enums may change, exposing early adopters to specification
    instability (mitigated by the semantic-versioning and migration commitment).'
  severity: moderate
  addressable: true
- description: Selective reporting is outside what the standard can detect. Materiality is recorded on
    dependencies and on limitations but not on claims, so a paper can specify every claim it makes, pass
    every layer, and still omit the claims that would have mattered. Closing this requires a claims-side
    materiality field and a rule about what must be reported, neither of which the current version contains.
  severity: moderate
  addressable: true
