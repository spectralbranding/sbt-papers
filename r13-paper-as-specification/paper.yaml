meta:
  title: 'Paper as Specification: A Machine-Readable Standard for Scientific Claims'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.19210037
  date: '2026-03-24'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - scientific verification
  - machine-readable claims
  - reproducibility crisis
  - structured science
  - open science
  - dependency graphs
  abstract: 'The verification crisis in science is a specification crisis. Papers communicate claims in
    natural language optimized for human comprehension but hostile to machine verification. Three prior
    generation-specification cycles — printing press, internet, and large language models — establish
    a pattern: each breakthrough in information production was resolved by a specification breakthrough,
    not by faster consumption. This paper introduces Paper Spec v0.1.0, an open YAML standard making a
    paper''s claims, methodology, acceptance criteria, and results machine-readable without replacing
    the paper, together with five verification layers from schema validation to retraction cascade analysis.
    A twenty-paper, two-program demonstration reveals dependency structures and specification deficiencies
    invisible in unstructured text; four formal propositions carry explicit falsification criteria. The
    paper then reports five results that five months of continuous use established and the design did
    not predict: at corpus scale the manifest becomes a generated projection of a typed claim graph; drift
    between specification and prose, not claim verification, is the binding constraint; the deliberate
    simplification of typed dependencies does not survive use, and the enlarged vocabulary maps onto existing
    published predicates; instrument provenance proves constitutive of a claim; and its materiality axis
    attaches to dependencies rather than claims, leaving selective reporting undetectable by construction.'
