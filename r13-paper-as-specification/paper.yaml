- id: P16
  type: proposition
  statement: 'In an AI-mediated research economy a claim without instrument provenance is not a specified
    claim. A specification layer must therefore record, on every node, how the node was produced -- by
    a person, by a named tool, or by a named model under a stated configuration -- together with the record
    locating the act. The corollary is a division the v0.1 design does not contain: reusable tooling should
    resolve its instrument indirectly, by role, so it can be changed in one place, whereas a pre-registered
    study must pin its instrument literally, because an instrument that changes silently between runs
    is not an instrument.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
  - P4
- id: P17
  type: proposition
  statement: The multi-author case has a specified mechanism rather than only an open question. Where
    a single-author linker must abort when two modules claim the same term, a federated linker can instead
    CLASSIFY every cross-owner interaction into a small closed set of relations and propose a typed, justified
    reconciliation before either author has read the other's prose, with definitional identity decided
    mechanically by content-addressed hashing rather than by judgement. What this does not do is settle
    the semantic questions for the authors; whether two independent authors accept such proposals is a
    stated, falsifiable next experiment. The single-author corpus is the degenerate case in which the
    two parties are the same person at two times and the negotiation collapses to a rebase.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P4
methodology:
  type: empirical
  design: 'Paper Spec v0.1.0: a YAML 1.2 companion file validatable against a JSON Schema, with top-level
    keys spec_version + meta (required) and claims, methodology, acceptance, dependencies, results, limitations,
    contradictions, repositories, submission_history, computation (all optional). Claims carry stable,
    unique IDs; dependencies are typed (extends/applies/tests/contradicts/refines) and flagged critical:
    true|false; external references take the form doi:claim_id. The L0-L4 verification stack: L0 schema
    validation (deterministic, automated, reference implementation exists), L1 internal consistency (rules
    engine, no NLP), L2 completeness (paper.md vs paper.yaml, LLM-assisted, suggestions not verdicts),
    L3 plausibility (cross-document LLM first-pass filter, not a human replacement), L4 cross-corpus integrity
    (retraction-cascade, contradiction detection, dependency-graph traversal, claim-level semantic search
    over a corpus of paper.yaml files).'
  analysis:
    software: https://github.com/spectralbranding/sbt-papers/tree/main/r13-paper-as-specification
acceptance:
- claim_id: P6
  criterion: Holds if (Paper Proposition 1 -- Expressiveness) A paper.
  falsification: Falsified if inter-rater agreement between YAML-only and full-paper reconstruction falls
    below kappa = .70 in an independent multi-field pilot.
- claim_id: P7
  criterion: Holds if (Paper Proposition 2 -- Verification utility) Automated L1 (internal consistency)
    and L2 (completeness) checks over a corpus of paper.
  falsification: Falsified if L1/L2 checks flag genuine deficiencies in fewer than 60% of first-draft
    files authored by non-paper-authors.
- claim_id: P8
  criterion: Holds if (Paper Proposition 3 -- Dependency analysis) The dependency graph built from paper.
  falsification: Falsified if dependency-graph recall deviates from expert-coded retraction-impact sets
    by more than 20% on a gold-standard corpus with known retraction history.
- claim_id: P9
  criterion: Holds if (Paper Proposition 4 -- Cognitive value) The thirty-to-sixty-minute specification
    overhead is dominated by the cognitive work of articulating claims and acceptance criteria -- work
    that improves the paper itself; researchers writing paper.
  falsification: Falsified if fewer than 30% of researchers completing paper.yaml before submission independently
    identify at least one substantive issue not otherwise caught.
- claim_id: P13
  criterion: Holds if at corpus scale the manifest ceases to be the authored artifact and becomes a projection.
  falsification: If an independent author maintaining a comparable corpus continues to hand-author manifests
    at scale without adopting a generative upstream artifact, and reports no loss from doing so, the projection
    claim is a local artifact of this author's tooling rather than a property of the standard at scale.
- claim_id: P14
  criterion: Holds if the binding constraint on a specification layer for science is not verification
    of the claims but DRIFT between the specification and the prose it specifies.
  falsification: If a corpus maintained under L0-L4 alone shows no measurable accumulation of specification-prose
    divergence over a substantial number of edits, then drift is not the binding constraint and the additional
    gate is redundant.
- claim_id: P15
  criterion: Holds if the deliberate simplification of typed citation relationships to five does not survive
    sustained use.
  falsification: If an independently developed claim vocabulary of comparable size shows substantially
    lower coverage against the published predicate sets, the convergence is specific to this author's
    vocabulary rather than a general property, and competing rather than emitting remains defensible.
- claim_id: P16
  criterion: Holds if in an AI-mediated research economy a claim without instrument provenance is not
    a specified claim.
  falsification: If claims carrying full instrument provenance prove no more reproducible or auditable
    than otherwise-identical claims without it, provenance is metadata decoration rather than constitutive,
    and the field is optional.
- claim_id: P17
  criterion: Holds if the multi-author case has a specified mechanism rather than only an open question.
  falsification: If two independent authors, given the classified interactions and proposed reconciliations
    for their overlapping modules, reject or ignore the proposals at a rate indistinguishable from unaided
    negotiation, the mechanism adds no value over reading each other's papers.
