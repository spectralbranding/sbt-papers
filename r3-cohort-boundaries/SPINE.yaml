# ============================================================================
# Methods — analytic derivations and the simulation harness
# ============================================================================
methods:
  - id: M1
    statement: >-
      Dirichlet moment computation: from the marginal moment formulas for
      Dir(alpha,...,alpha), derive component mean 1/n, variance
      (1/n)(1-1/n)/(n alpha+1), and negative covariance, then propagate to the
      expected squared pairwise Euclidean distance E[||w_i - w_j||^2] =
      2(n-1)/(n(n+1)) = 7/36 at n=8 (Proposition 2, Theorem 1a).
    type: "analytic_derivation"
    inputs: ["Dirichlet moment formulas (Johnson & Kotz 1972)"]
    outputs: ["component moments; expected pairwise distance 7/36"]
    code_anchor: "paper §3.2 Prop 2; §3.3 Thm 1a proof"
    body_sections: ["§3.2", "§3.3 Beyer's Distance Contrast Phenomenon"]
  - id: M2
    statement: >-
      Brunn-Minkowski peeling on convex partitions: the homothet of each cell
      scaled by (1-delta) bounds the interior-volume fraction; since Delta^{n-1}
      has intrinsic dimension n-1, Lebesgue measure scales as the (n-1)th power
      of linear size, yielding the boundary volume fraction lower bound
      BVF(n,delta) >= 1 - (1-delta)^{n-1}.
    type: "analytic_derivation"
    inputs: ["convex k-partition", "Schneider 2014 Brunn-Minkowski toolkit"]
    outputs: ["BVF(n,delta) >= 1 - (1-delta)^{n-1}"]
    code_anchor: "paper §4.2 Theorem 2 proof"
    body_sections: ["§4.2 Boundary Fraction Theorem for Convex Partitions"]
  - id: M3
    statement: >-
      Sphere-isometry route to concentration: the square-root transform maps
      Delta^{n-1} isometrically to S^{n-1}_+ so that Fisher-Rao distance becomes
      geodesic distance; Levy's lemma / the Gaussian isoperimetric inequality on
      the sphere (log-Sobolev constant (n-1)^{-1}, Herbst argument) yields
      P(|f - M_f| >= eps) <= 4 exp(-(n-1)eps^2/8). The Dirichlet is not a product
      measure, so Talagrand's product-space bounds do not apply directly.
    type: "analytic_derivation"
    inputs: ["square-root isometry Delta^{n-1} -> S^{n-1}_+", "Milman-Schechtman 1986"]
    outputs: ["Levy bound on S^7: 4 exp(-7 eps^2/8)"]
    code_anchor: "paper §3.1 Proposition 1 proof"
    body_sections: ["§3.1 Levy's Lemma and Spherical Concentration"]
  - id: M4
    statement: >-
      Monte Carlo harness: draw Dirichlet samples, compute Euclidean and
      Fisher-Rao distance statistics, run k-means at k=4, and report boundary
      volume fractions under both metrics; seed fixed at 42, run via
      `uv run --with numpy --with scikit-learn python r3_concentration_mc.py`.
    type: "simulation"
    inputs: ["Dir(1,...,1) on Delta^{n-1}"]
    outputs: ["Tables 2, 5, 7"]
    code_anchor: "code/r3_concentration_mc.py"
    reproducibility:
      seed: "42"
      runtime_environment: "Python 3.12 + uv (numpy, scikit-learn)"
    body_sections: ["§5.3 Companion Computation Script"]
  - id: M5
    statement: >-
      Concentrated-Dirichlet scaling derivation: via Stirling on the normalizing
      constant Gamma(n alpha)/Gamma(alpha)^n and log-concavity of f_alpha for
      alpha>=1, the probability mass of a fixed convex boundary zone contracts by
      the product of (n-1) per-direction factors alpha^{-1/2}, giving
      V_boundary(alpha) <= V_boundary(1) * alpha^{-(n-1)/2} = alpha^{-3.5} at n=8.
    type: "analytic_derivation"
    inputs: ["Dir(alpha,...,alpha) density", "Frigyik et al. 2010 concentration scaling"]
    outputs: ["V_boundary(alpha) <= V_boundary(1) * alpha^{-7/2}"]
    code_anchor: "paper §8.2 Proposition 3 proof"
    body_sections: ["§8.2 Boundary Volume Fraction Under Dirichlet(alpha)"]

# ============================================================================
# Measurements — the headline computed/derived numbers
# ============================================================================
measurements:
  - id: m_contrast
    statement: >-
      Distance contrast ratio R_8 = 7.46 (Euclidean) at n=8 (mean Euclidean
      distance .4254, SD .1052, CV .247); the transitional regime R_8 in [5,10].
    source_observations: [O1]
    generating_method: M4
    value: "R_8 = 7.46 (Euclidean)"
    units: "max/min distance ratio"
    body_sections: ["§3.3 Table 2", "§5.1"]
  - id: m_bvf
    statement: >-
      Boundary volume fraction lower bound BVF(8, .10) >= 52.2% (= 1 - .9^7) at
      the intrinsic-dimension exponent n-1=7, where delta is depth into a cell as
      a fraction of that cell's VOLUME RADIUS r_V = (vol(C)/omega_d)^(1/d) and
      distance is to the FULL cell boundary (internal bisectors together with the
      bounding faces of the simplex); the earlier ambient-dimension figure 57.0%
      is the conservative variant.
    source_observations: []
    generating_method: M2
    value: "BVF(8, .10) >= .522"
    units: "volume fraction of Delta^7"
    body_sections: ["§4.2 Table 3", "§4.2 Theorem 2"]
  - id: m_bvf_empirical
    statement: >-
      Empirical boundary fractions (k=4 Voronoi, 10^5 samples, seed 42) of
      51.7% / 78.7% / 97.0% at delta = .05 / .10 / .20 under the settled
      definition (delta relative to the cell volume radius, distance to the full
      cell boundary), exceeding the Theorem 2 lower bounds (30.2% / 52.2% /
      79.0%) by 22-27 points because the bound is attained only by a Euclidean
      ball. Measured cell volume shares .183/.183/.263/.372, in-radii .091-.097,
      volume radii .216-.239, mean R/r_V = .424.
    source_observations: [O2]
    generating_method: M4
    value: "78.7% at delta=.10 (empirical, k=4, settled definition)"
    units: "volume fraction"
    body_sections: ["Table 7"]
  - id: m_fisher_rao
    statement: >-
      Fisher-Rao contrast ratio R_8 = 5.72 (~70% of Euclidean), mean geodesic
      distance 1.214 rad against an analytic 2*arccos(E[BC]) = 1.252 rad that
      bounds it above by Jensen (arccos is concave), CV .230 — same transitional regime; the BVF bound
      1 - (1-delta)^{n-1} transfers verbatim (52.2% at delta=.10).
    source_observations: [O3]
    generating_method: M4
    value: "R_8^{FR} = 5.72; BVF^{FR}(8,.10) >= .522"
    units: "ratio; volume fraction"
    body_sections: ["§3.4 Table 7"]
  - id: m_alpha_scaling
    statement: >-
      Concentration factor alpha^{-3.5} sends the uniform 52.2% boundary fraction
      to <=1.12% at alpha=3 and <=.187% at alpha=5; empirical behavioral alpha in
      [3,10] gives boundary fractions in roughly .02-3.7% (operationally crisp).
    source_observations: []
    generating_method: M5
    value: "V_boundary(3) <= 1.12% ; V_boundary(5) <= .187%"
    units: "volume fraction"
    body_sections: ["§8.3 Table 6", "§8.4"]

# ============================================================================
# Propositions — the core theoretical claims
# ============================================================================
  - id: m_bisector_proximity
    statement: >-
      Under the uniform null with a k-means partition at k>=3, the mean Euclidean
      distance to the nearest inter-cohort bisector is .088 against a component
      SD of .1102 (ratio .795 at k=4), and approximately two-thirds of observers
      lie within one component SD of a bisector: 66.3 / 69.1 / 69.1 / 69.7 /
      69.5% at k = 3/4/5/6/8, and 67.9% (SD .96 pp) across seeds 42-46 at k=4.
      k=2 is the degenerate outlier at 49.1%. For 85.4% of observers the nearest
      piece of cell boundary is a face of the simplex, not a bisector.
    source_observations: [O2]
    generating_method: M4
    value: "~68% within one component SD of an inter-cohort bisector (k>=3)"
    units: "fraction of observers"
    body_sections: ["Table 8", "Proposition 4"]
  - id: m_refit_alpha
    statement: >-
      With the k=4 partition RE-FIT to each Dir(alpha,...,alpha) population and
      each population compared against its own component SD, the within-one-SD
      bisector fraction RISES with alpha — 69.1 / 72.5 / 74.8 / 76.7 / 78.4 /
      80.6% at alpha = 1/2/3/5/10/30 — while the scale-free ratio of mean
      bisector distance to component SD FALLS from .795 to .605.
    source_observations: [O2]
    generating_method: M4
    value: "69.1% -> 80.6% over alpha in [1,30] under re-fitting"
    units: "fraction of observers"
    body_sections: ["Table 10"]

propositions:
  - id: P1
    statement: >-
      The SBT observer spectral profile contains a weight vector
      w = (w_1,...,w_8) in Delta^7 (sum-to-one finite-attention allocation across
      the eight dimensions), and the observer weight space is the probability
      simplex Delta^7 equipped with the Fisher-Rao metric (the unique metric
      invariant under sufficient statistics, Cencov's theorem).
    conditions: "C1"
    antecedents: []
    evidence:
      - type: analytic
        anchor: "SBT dimensional architecture + Fisher-Rao / Cencov uniqueness, established in 2026a and 2026d."
    body_sections: ["§2.1 SBT Framework", "§2.2 The Observer Weight Space"]
  - id: P2
    statement: >-
      A perceptual cohort is a cluster of observers whose weight profiles are
      geometrically proximate in Delta^7 — defined by HOW observers process
      signals (signal-interpretation), not by who they are demographically;
      cohorts are perceptual, not demographic segments.
    conditions: "C1"
    antecedents: [P1]
    evidence:
      - type: analytic
        anchor: "Signal-processing basis for cohort formation; brand-as-signal tradition (Erdem & Swait 1998)."
    body_sections: ["§2.1 SBT Framework and Dimensional Architecture"]
  - id: P3
    statement: >-
      Levy concentration holds on S^7: for any 1-Lipschitz f,
      P(|f - M_f| >= eps) <= 4 exp(-7 eps^2/8). The bound becomes non-trivial
      only for eps >= 1.07, placing n=8 in a transitional concentration regime
      (present but not dominant), and any Lipschitz function of observer position
      — including distance to a cohort centroid — cannot vary much from typical.
    conditions: "C1, AA2"
    antecedents: [P1]
    evidence:
      - type: analytic
        anchor: "Proposition 1; sphere-isometry route via Milman-Schechtman; blowup inequality on sets of measure >= 1/2."
    falsifier: "If a 1-Lipschitz function on S^7 deviates from its median more often than 4 exp(-7 eps^2/8) allows, P3 fails."
    body_sections: ["§3.1 Levy's Lemma and Spherical Concentration"]
  - id: P4
    statement: >-
      Pairwise distances on Delta^7 concentrate (Theorem 1): the expected
      squared Euclidean distance is 2(n-1)/(n(n+1)) = 7/36 at n=8, and the
      distance contrast ratio R_n degrades monotonically with dimension to
      R_8 ~ 7.46 — a transitional regime where clustering is POSSIBLE (distances
      carry discriminative information) but INHERENTLY NOISY (the nearby/far-away
      boundary is blurred), so the recovered cluster count depends sensitively on
      the algorithm's distance threshold.
    conditions: "C1, C3, AA1"
    antecedents: [P1, P3]
    evidence:
      - type: analytic
        anchor: "Theorem 1; Beyer et al. (1999) distance-concentration framework; CV_n ~ O(n^{-1/2})."
      - type: empirical
        anchor: "Monte Carlo Table 2 / §5.1 (m_contrast)."
    falsifier: "If independent Monte Carlo at n=8 returns R_8 far from 7.46, or the CV_n ~ O(n^{-1/2}) decay fails across n, P4 fails. NOTE: the Proposition 2 variance identity is NOT a falsifier — draws from Dir(1,...,1) cannot contradict an algebraic identity of the family they are drawn from; what is testable there is whether real observer weights are described by a symmetric Dirichlet at all."
    body_sections: ["§3.3 Beyer's Distance Contrast Phenomenon", "§5.1"]
  - id: P5
    statement: >-
      Boundary fuzziness theorem (Theorem 2): for ANY convex k-partition (k>=2)
      of Delta^{n-1}, the boundary volume fraction satisfies
      BVF(n,delta) >= 1 - (1-delta)^{n-1}, where delta is depth into a cell as a
      fraction of that cell's VOLUME RADIUS and the distance is to the FULL cell
      boundary; at n=8, delta=.10 this is >= 52.2%, so a MAJORITY of the simplex
      lies near the boundary of its own cohort region. The (n-1) exponent is the
      simplex's intrinsic dimension. The bound is attained by a Euclidean ball
      and is conservative for simplicial and Voronoi cells. It bounds VOLUME near
      a cell boundary, and does NOT by itself bound the fraction of observers at
      risk of cohort reassignment, because 85.4% of the volume it counts abuts a
      face of the simplex rather than an inter-cohort frontier (see P14).
    conditions: "C1, C2, AA1"
    antecedents: [P1]
    evidence:
      - type: analytic
        anchor: "Theorem 2; Brunn-Minkowski applied to the inner parallel body C_{-t} (+) tB <= C (Schneider 2014, Vershynin 2018)."
      - type: analytic
        anchor: "Thin-box witness: normalising delta by the in-radius R instead of r_V asserts a bound Brunn-Minkowski does not deliver, and is false whenever R < r_V."
      - type: empirical
        anchor: "Monte Carlo k=4 Voronoi Table 7: empirical 78.7% at delta=.10 exceeds the bound; the in-radius reading returns 44.9%, BELOW the bound (m_bvf, m_bvf_empirical)."
    falsifier: "If a convex k-partition of Delta^7 puts less than 1-(1-delta)^{n-1} of the simplex volume within delta*r_V of its own cell's full boundary, P5 fails. A measurement that normalises delta differently, or that measures to the internal bisectors only, does not test P5."
    body_sections: ["Theorem 2, Boundary Fraction Theorem for Convex Partitions"]
  - id: P6
    statement: >-
      The boundary fuzziness is GEOMETRIC, not statistical: Theorem 2 holds for
      the deterministic geometric volume of the simplex regardless of sample
      size. Unlike LDA posterior uncertainty (which sharpens with more data), a
      researcher with arbitrarily many observations can locate w in Delta^7 with
      arbitrary precision and still face >= 52% of those precise profiles near a
      partition boundary — the fuzziness derives from Brunn-Minkowski, not data
      sparsity.
    conditions: "C1, C2"
    antecedents: [P5]
    evidence:
      - type: analytic
        anchor: "Geometric-vs-statistical distinction; contrast with LDA (Blei, Ng & Jordan 2003)."
    body_sections: ["§3.2 (Geometric versus statistical fuzziness)"]
  - id: P7
    statement: >-
      Boundary fuzziness scales with dimension: at delta=.10 the boundary
      fraction rises from 10% at n=2 (sharp segments) to 52.2% at n=8 (majority
      boundary) to 99.3% at n=48 (essentially all boundary). n ~ 5 is the
      dimensionality threshold beyond which discrete assignment systematically
      misrepresents a majority of the population.
    conditions: "C1, C2"
    antecedents: [P5]
    evidence:
      - type: analytic
        anchor: "Table 4 cross-dimension comparison of BVF(n,.10)."
    body_sections: ["§4.2 (Comparison across dimensions)"]
  - id: P8
    statement: >-
      The uniform Dirichlet is the WORST case FOR A FIXED ZONE (Corollary 2):
      holding the partition geometry fixed, V_boundary(alpha) is strictly
      decreasing in alpha, so symmetric Dir(alpha,...,alpha) with alpha>1 places
      less mass inside that same unmoving zone. The reduction factor is
      alpha^{-(n-1)/2}=alpha^{-3.5} at n=8 (Proposition 3), giving under 2% for
      alpha in [3,10] against a zone pinned at its alpha=1 geometry. The
      fixed-zone clause is NOT a formality and does not license a calibration
      reading of fuzziness severity; see P15.
    conditions: "C3"
    antecedents: [P5]
    evidence:
      - type: analytic
        anchor: "Proposition 3 + Corollary 2; Stirling + log-concavity Brunn-Minkowski argument."
      - type: empirical
        anchor: "Table 6 numerical values; behavioral alpha range [3,10] (Frigyik et al. 2010, Aitchison 1986)."
    falsifier: "If for some alpha_1 > alpha_2 >= 1 a Monte Carlo study shows more mass in a zone HELD FIXED at its alpha=1 geometry under alpha_1 than under alpha_2, or the rate departs from alpha^{-3.5}, P8 fails. A measurement taken under a re-fitted partition does not test P8 (that is P15)."
    body_sections: ["Boundary Fuzziness Under Concentrated Distributions"]
  - id: P9
    statement: >-
      Corollary 1: cohort membership is dynamic and fuzzy for approximately
      two-thirds of observers under the uniform null. An observer at distance eps
      from an inter-cohort bisector is reassigned by a shift of eps toward it, and
      two-thirds have eps below one component SD (.1102, Proposition 2) — a shift
      the population's own variability supplies. This REST ON P14, not on P5: it
      is an empirical result about k-means partitions at k>=3 under a specific
      null, not a geometric necessity holding for every convex partition. Earlier
      versions derived it from P5's 52.2% volume figure; that inference does not
      hold, because the volume P5 counts is dominated by simplex-face proximity.
      The claim survives at a LARGER figure under the weaker modality.
    conditions: "C1, C2, AA1"
    antecedents: [P14, P4]
    evidence:
      - type: empirical
        anchor: "Proposition 4 / Table 8 (m_bisector_proximity); SD .1102 from Proposition 2 sets the perturbation scale."
    falsifier: "If a k-means partition at k>=3 leaves fewer than half of observers within one component SD of an inter-cohort bisector, Corollary 1 fails. Inherited from P14."
    body_sections: ["Implications for Cohort Cardinality"]
  - id: P10
    statement: >-
      Cohort count is resolution-dependent, not an objective population feature:
      because distances concentrate, the elbow-method WCSS curve is smooth rather
      than kinked and silhouette scores are depressed, so different algorithms /
      thresholds / initializations (or different AI models) recover different k
      from identical data without any being more "correct." This formally
      explains the motivating observation — Claude recovered 5-6 cohorts and
      Gemini 3 cohorts for the same five case-study brands.
    conditions: "C1, C2"
    antecedents: [P4, P5]
    evidence:
      - type: analytic
        anchor: "WCSS smoothness + silhouette depression from Theorem 1; cross-model granularity dissociation."
      - type: self_application
        anchor: "Cross-model replication in 2026a (identical coherence grades, divergent cohort granularities) is exactly what the geometry predicts."
    body_sections: ["§6.1 Why Cohort Count Is Resolution-Dependent", "§6.2 Cross-Model Agreement as Evidence"]
  - id: P11
    statement: >-
      Methodological prescription: discrete ("rasterized") cohort assignment is
      geometrically lossy in 8 dimensions — it discards how close each observer
      is to a boundary and which adjacent cohort they are nearest — and this loss
      is the direct analogue of the R2 metamerism bound. The "vectorized"
      alternative retains the continuous w in Delta^7 and computes distances,
      means, geodesics, and predicted responses on the simplex directly via the
      Fisher-Rao metric, avoiding the loss entirely. Source-anchored alignment
      d_FR(w_observed, w_designed) is genuinely discriminating, unlike the
      trivially-concentrated inter-stakeholder agreement of brand workshops.
    conditions: "C1, C2"
    antecedents: [P5, P7]
    evidence:
      - type: analytic
        anchor: "Rasterized-vs-vectorized analysis; rasterization loss as metamerism analogue (2026e); source-vector anchoring breaks trivial concentration."
    body_sections: ["§6.4 From Categorical Segments to Continuous Profiles"]
  - id: P12
    statement: >-
      Capacity-resolution duality: R3's distance-concentration (Theorem 1) and
      boundary-volume (Theorem 2) results bound how many distinguishable cohort
      positions Delta^7 can resolve in observer space O — finer resolution
      (larger k) shrinks each cohort's crisp interior while distance
      concentration caps the count — which is DUAL to R4's sphere-packing bound
      on how many brand positions are distinguishable in brand space B. Together
      they bound the information the SBT framework can simultaneously encode.
    conditions: "C1, C2"
    antecedents: [P4, P5]
    evidence:
      - type: analytic
        anchor: "Capacity-resolution trade-off; dual to 2026g packing bound (Conway & Sloane 1999)."
    body_sections: ["§6.5 Capacity-Resolution Duality"]
  - id: P13
    statement: >-
      Static concentration geometry interacts with non-ergodic dynamics: the wide
      bisector zone (~two-thirds of observers within one component SD, P14) amplifies non-ergodic effects (a single
      signal-driven boundary crossing can trigger an irreversible cohort
      transition), and SBT's absorbing states / crystallized priors restrict the
      dynamics to poorly connected subsets of S^7_+, breaking the conditions
      under which Levy's lemma would predict uniform perception — explaining why
      observers persistently perceive the same brand differently.
    conditions: "C1"
    antecedents: [P3, P5]
    evidence:
      - type: analytic
        anchor: "Non-ergodicity (Peters 2019); bounded-confidence fragmentation (Hegselmann & Krause 2002); full dynamics deferred to 2026j."
    body_sections: ["§7 Connection to Non-Ergodic Dynamics"]
  - id: P14
    statement: >-
      Inter-cohort bisector proximity (Proposition 4): under the uniform null
      with a k-means partition at k>=3, the mean Euclidean distance to the
      nearest inter-cohort bisector is .088 — BELOW the component SD of .1102 —
      and approximately two-thirds of observers lie within one component SD of a
      bisector. Stable in k for k>=3 (66.3-69.7%) and across seeds (67.9%, SD
      .96 pp), degenerate at k=2 (49.1%). This is the quantity that governs
      cohort-reassignment risk, and it is measured rather than derived: P5 bounds
      volume near the FULL cell boundary, of which 85.4% abuts a face of the
      simplex where no perturbation can reassign anyone.
    conditions: "C1, C2, AA1"
    antecedents: [P4]
    evidence:
      - type: empirical
        anchor: "Table 8 / m_bisector_proximity; component SD .1102 from Proposition 2 supplies the perturbation scale."
    falsifier: "An elicited sample of real observer weight profiles on Delta^7, partitioned by the same procedure at k>=3, in which the mean distance to the nearest inter-cohort bisector EXCEEDS that sample's component SD, or in which fewer than half of observers lie within one such SD. A population of well-separated compact clusters would produce exactly that, so the test discriminates. It requires an observer-weight elicitation and is not answerable from artifact-level brand measurements, which record a different object."
    body_sections: ["Proposition 4", "Table 8"]
  - id: P15
    statement: >-
      Re-fitting reverses the practical reading of P8: clustering re-fits the
      partition to the population, so as mass concentrates the boundaries follow
      it. Measured with the k=4 partition re-fit at each alpha and each
      population compared against its OWN component SD (both distances and the
      perturbation scale contract as alpha^{-1/2}), the within-one-SD bisector
      fraction RISES from 69.1% at alpha=1 to 80.6% at alpha=30 while the
      scale-free ratio FALLS from .795 to .605. P8's arithmetic is unaffected —
      it is a correct statement about a fixed zone — but the step from it to a
      claim about real practice fails, since no practitioner holds a partition
      fixed while the population moves. Consequently the methodological
      prescription (P11) does not depend on the population being uniform and does
      not wait on an estimate of alpha.
    conditions: "C1, C2"
    antecedents: [P8, P14]
    evidence:
      - type: empirical
        anchor: "Table 10 / m_refit_alpha; alpha in [1,30], covering the [3,10] behavioural window."
    falsifier: "If, under a partition re-fit to each Dir(alpha,...,alpha) population and compared against that population's own component SD, the within-one-SD bisector fraction FALLS materially with alpha, P15 fails and P8's calibration reading is restored. Sensitive to the clustering procedure: only fixed-k k-means is tested here, and a procedure that also selects k from the data is untested."
    body_sections: ["Concentration Under a Re-Fitted Partition", "Table 10"]

# ============================================================================
# Derivations — key closed-form results
# ============================================================================
derivations:
  - id: D1
    statement: >-
      E[||w_i - w_j||^2] = 2 sum_l Var[X_l] = 2(n-1)/(n(n+1)) = 7/36 ~ .1944 at
      n=8 (sqrt ~ .4410); first derived in 2026d for the warped-product manifold,
      recovered here directly from Dirichlet moments.
    derived_from: [M1]
    antecedents: [P4]
    body_sections: ["§3.3 Theorem 1(a) proof"]
  - id: D2
    statement: >-
      BVF(n,delta) >= 1 - (1-delta)^{n-1}, the intrinsic-dimension boundary
      volume fraction, by Brunn-Minkowski peeling and the (n-1)-power scaling of
      Lebesgue measure on the simplex; tight for centroid hyperplane bisections,
      conservative for k>=3.
    derived_from: [M2]
    antecedents: [P5]
    body_sections: ["§4.2 Theorem 2 proof"]
  - id: D3
    statement: >-
      V_boundary(alpha) <= V_boundary(1) * alpha^{-(n-1)/2} = alpha^{-3.5} at
      n=8, via Stirling on Gamma(n alpha)/Gamma(alpha)^n and (n-1) per-direction
      log-concave contraction factors alpha^{-1/2}.
    derived_from: [M5]
    antecedents: [P8]
    body_sections: ["§8.2 Proposition 3 proof"]

# ============================================================================
# Findings — what the simulations demonstrate
# ============================================================================
findings:
  - id: F1
    statement: >-
      Monte Carlo confirms the distance-concentration prediction within sampling
      error: at n=8, R_8 = 7.46, mean Euclidean distance .4254 (just below the
      theoretical sqrt(7/36)=.4410, consistent with Jensen), SD .1052; and the
      contrast ratio degrades monotonically from ~10^4 at n=2 to 2.47 at n=32.
    type: "simulation_confirmation"
    source_measurements: [m_contrast]
    generating_method: M4
    antecedents: [O1]
    falsifier: "If repeated runs at seed 42 do not reproduce R_8 ~ 7.46 within the reported SE, F1 fails."
    citation_role_in_paper: "primary_evidence_for_P4"
    body_sections: ["§5.1 Distance Ratio Simulations"]
  - id: F2
    statement: >-
      Monte Carlo confirms the boundary-volume bound under the settled definition
      of delta: empirical k=4 Voronoi fractions 51.7% / 78.7% / 97.0% at
      delta=.05/.10/.20 exceed the Theorem 2 lower bounds (30.2% / 52.2% /
      79.0%) by 22-27 points, as expected since the bound is attained only by a
      Euclidean ball. Measured under an in-radius normalisation the same
      quantity returns 25.3% / 44.9% / 71.4% — BELOW the bound at every width,
      which is how a normalisation the proof cannot support shows up numerically.
    type: "simulation_confirmation"
    source_measurements: [m_bvf, m_bvf_empirical]
    generating_method: M4
    antecedents: [O2]
    falsifier: "If empirical k=4 boundary fractions measured under the settled definition fall below the Theorem 2 lower bound, F2 (and P5) fail."
    citation_role_in_paper: "primary_evidence_for_P5"
    body_sections: ["Table 7, Boundary Proximity Simulations"]
  - id: F4
    statement: >-
      The boundary zone of Theorem 2 is not the reassignment zone. For 85.4% of
      observers the nearest piece of cell boundary is a face of the simplex — a
      near-zero weight component — rather than an inter-cohort bisector, and no
      perturbation can push a weight below zero. Measured directly, the mean
      distance to the nearest bisector is .0877 against a component SD of .1102,
      and approximately two-thirds of observers lie within one component SD of a
      bisector. The reassignment claim therefore survives at a LARGER figure than
      the 52.2% it previously rested on, but as an empirical result about
      k-means partitions at k>=3 rather than as a geometric necessity.
    type: "measurement"
    source_measurements: [m_bisector_proximity]
    generating_method: M4
    antecedents: [O2]
    falsifier: "Inherited from P14."
    citation_role_in_paper: "primary_evidence_for_P14_and_P9"
    body_sections: ["Table 8", "What the Boundary Zone Contains"]
  - id: F5
    statement: >-
      Concentration does not sharpen cohort boundaries once the partition is
      re-fit. Comparing each Dir(alpha,...,alpha) population against its own
      component SD, the within-one-SD bisector fraction rises from 69.1% at
      alpha=1 to 80.6% at alpha=30 and the scale-free ratio falls from .795 to
      .605, across a range that contains the [3,10] behavioural window. The
      alpha^{-3.5} contraction remains correct for a zone held fixed; what does
      not follow is the inference to real practice.
    type: "measurement"
    source_measurements: [m_refit_alpha, m_alpha_scaling]
    generating_method: M4
    antecedents: [O2]
    falsifier: "Inherited from P15."
    citation_role_in_paper: "primary_evidence_for_P15"
    body_sections: ["Table 10", "Concentration Under a Re-Fitted Partition"]
  - id: F3
    statement: >-
      The qualitative conclusions hold under both metrics: Fisher-Rao gives
      R_8 = 5.72 (~70% of Euclidean) in the same transitional regime, and the
      boundary-volume bound is identical in form and value (52.2% at delta=.10)
      because the square-root isometry preserves intrinsic dimension. The mean
      geodesic distance is 1.214 rad; the analytic 2*arccos(E[BC]) = 1.252 rad
      is an upper bound on it by Jensen, not an estimate of it.
    type: "robustness_confirmation"
    source_measurements: [m_fisher_rao]
    generating_method: M4
    antecedents: [O3]
    citation_role_in_paper: "supports_AA2_and_P3_P5"
    body_sections: ["§3.4 Fisher-Rao Recalculation"]

# ============================================================================
# Robustness checks
# ============================================================================
robustness_checks:
  - id: RC1
    statement: >-
      Fisher-Rao recalculation (§3.4): SBT's canonical metric is recomputed via
      the square-root isometry to S^7_+; both the contrast ratio (5.72 vs 7.46)
      and the BVF bound (identical, 52.2%) confirm that the Euclidean-distance
      simplification of §§3.1-3.3 does not change the qualitative conclusions.
    type: "metric_sensitivity_check"
    sensitivity_of: [P3, P4, P5]
    mitigates: [L2]
    body_sections: ["§3.4 Fisher-Rao Recalculation"]
  - id: RC2
    statement: >-
      Concentrated-Dirichlet sensitivity (§8): replacing the uniform null with
      symmetric Dir(alpha,...,alpha) for alpha>1 shows the headline 52.2% is the
      worst case and real populations (alpha in [3,10]) have boundary fractions
      below 2% — the uniform bound is conservative, not a typical-case claim.
    type: "distributional_sensitivity_check"
    sensitivity_of: [P5, P9]
    mitigates: [L1]
    body_sections: ["§8 Boundary Fuzziness Under Concentrated Distributions"]

# ============================================================================
# Alternative explanations — rivals the paper addresses
# ============================================================================
alternative_explanations:
  - id: A1
    statement: >-
      The boundary fuzziness is just the familiar posterior uncertainty of
      Latent Dirichlet Allocation (Blei, Ng & Jordan 2003), which sharpens with
      more data.
    rules_out_required: [P5, P6]
    ruled_out_by: [P6]
    rules_out_status: "rejected"
    reasoning: >-
      LDA fuzziness is statistical (data-limited; vanishes in the infinite-data
      limit). Theorem 2's fuzziness is geometric — a property of the deterministic
      simplex volume under any partition — and persists at arbitrary precision.
    body_sections: ["§3.2 (Geometric versus statistical fuzziness)"]
  - id: A2
    statement: >-
      The "blessing of dimensionality" (Gorban & Tyukin 2018) — individual points
      become stochastically separable as dimension grows — contradicts the
      majority-near-boundary result.
    rules_out_required: [P5]
    ruled_out_by: [P5]
    rules_out_status: "reconciled"
    reasoning: >-
      The two are compatible at different levels: Gorban-Tyukin characterize
      separability of INDIVIDUAL points from a fixed reference; Theorems 1-2
      characterize concentration of PAIRWISE distances and the volume of boundary
      ZONES under any partition. High point-separability does not prevent
      voluminous boundary zones.
    body_sections: ["§3.3 (Relation to the blessing of dimensionality)"]

# ============================================================================
# Limitations
# ============================================================================
limitations:
  - id: L1
    statement: >-
      The headline bounds assume the uniform (or symmetric-alpha) Dirichlet null.
      Real populations may show HETEROGENEOUS concentration (dimension-specific
      alpha_i), for which the alpha^{-(n-1)/2} scaling no longer applies directly
      (the effective contraction depends on the geometric mean of the alpha_i);
      the sparse alpha<1 (vertex-concentrated) regime is also left to future work.
    severity: "scope-bounding"
    affects: [P8, P5]
    body_sections: ["§9 (Uniform distribution assumption)"]
  - id: L2
    statement: >-
      The Monte Carlo and contrast computations use Euclidean distance while
      SBT's formal metric is Fisher-Rao; the two differ by a nonlinear transform,
      and although §3.4 recomputes the headline figures under Fisher-Rao,
      higher-precision recalculation across all dimensions is left open.
    severity: "precision-bounding"
    affects: [P4]
    body_sections: ["§9 (Euclidean versus Fisher-Rao distances)"]
  - id: L3
    statement: >-
      Theorem 2 assumes CONVEX cohort regions (k-means Voronoi, well-separated
      GMMs). Density-based clustering (DBSCAN/HDBSCAN) yields non-convex regions
      for which the bound may not hold in its current form; the Minkowski-content
      extension is possible but needs additional machinery.
    severity: "scope-bounding"
    affects: [P5]
    body_sections: ["§9 (Convexity of cohort regions)"]
  - id: L4
    statement: >-
      The Dirichlet imposes only the sum-to-one negative-correlation structure
      and does not model empirical dimension-specific correlations (e.g.,
      Ideological-Cultural co-weighting) or integral-vs-separable perceptual
      dimensions (Garner 1974), which could require a non-Euclidean (Minkowski
      r<2) metric and revisiting the bounds; effective dimensionality d_eff<8 if
      profiles cluster on a submanifold would also reduce concentration.
    severity: "model-fidelity"
    affects: [P4, P5]
    body_sections: ["§9 (Independence of dimensions; Effective dimensionality)"]

