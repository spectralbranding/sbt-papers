  abstract: 'This paper applies concentration-of-measure techniques to the probability simplex $\Delta^7$
    under the uniform Dirichlet$(1,\ldots,1)$ null, which is treated throughout as a worst-case geometry
    rather than as a description of observed populations. Three results follow. First, the Euclidean distance
    contrast ratio degrades to approximately 7.5 at $n = 8$, placing the space in a transitional regime
    where clustering remains informative yet noisy. Second, for any convex $k$-partition of $\Delta^7$,
    at least 52.2% of the volume lies within a tenth of a cell''s volume radius of that cell''s boundary.
    Third, Lévy''s lemma on the 7-sphere yields $P(|f - M_f| \geq \varepsilon) \leq 4\exp(-7\varepsilon^2/8)$
    for 1-Lipschitz functions. Monte Carlo simulations with $10^5$ draws confirm the predictions within
    sampling error. Because that boundary volume is dominated by proximity to the faces of the simplex,
    reassignment risk is measured separately: approximately two-thirds of observers lie within one component
    standard deviation of an inter-cohort bisector, a fraction stable across $k \geq 3$ and, under partitions
    re-fit to the population as clustering re-fits them, across $\alpha \in [1, 30]$. Concentration sharpens
    boundaries only against a zone held fixed. The results give a geometric foundation for preferring
    continuous observer profiles over discrete cohort labels once perceptual dimensionality exceeds five.'
