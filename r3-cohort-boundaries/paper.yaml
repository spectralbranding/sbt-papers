meta:
  title: 'Boundary Volume and Cohort Reassignment on the 7-Simplex: A Concentration Analysis Under the
    Uniform Null'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
