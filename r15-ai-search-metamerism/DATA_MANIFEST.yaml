# DATA_MANIFEST — 2026v (R15 AI Search Metamerism)
# Three-layer model (PAPER_DIR_REORG_PLAN_2026-06-16.md §0): bulk experiment data lives on HF
# (canonical, DOI) + git history; not carried in the internal SSOT.

paper: 2026v
hf_dataset:                     # dataset of record (umbrella R15 corpus)
  repo_id: spectralbranding/r15-ai-search-metamerism
  doi: 10.57967/hf/8284
  url: https://huggingface.co/datasets/spectralbranding/r15-ai-search-metamerism
  license: cc-by-4.0
analysis_snapshot:              # version of record for the paper's reported numbers (PINNED — not re-baselined)
  description: >
    The statistics reported in the paper are a FROZEN April-2026 analysis cut,
    pinned here rather than re-baselined to the live dataset. The HF dataset of
    record was revised to v3.1 on 2026-04-25 (commit a7b4b72: corrected run
    count, additional records); re-running the current pipeline shifts per-model
    Table-7 DCIs by up to ~.01 with no change to aggregate stats or conclusions.
  frozen_artifacts:
    - r15-ai-search-metamerism/experiment/L4_analysis/run5_analysis_results.json
    - r15-ai-search-metamerism/experiment/L4_analysis/run5_dci_table.csv
  dataset_revision_at_freeze: "pre-v3.1 (before HF commit a7b4b72, 2026-04-25)"
  aggregate_invariant: "mean DCI .356; cross-model cosine .977; d = 3.373"
# R15 also has a companion exp-* family on HF, each separately DOI'd (the dataset
# of record above is the canonical Zenodo related-ID; the others are linked from it):
#   r15-synthetic-cohorts 10.57967/hf/8441; exp-agentic-collapse 10.57967/hf/8437;
#   exp-cross-language 10.57967/hf/8439; exp-competitive-interference 10.57967/hf/8435;
#   exp-bf-format 10.57967/hf/8440; exp-primacy-generalization 10.57967/hf/8436;
#   exp-compounding-format 10.57967/hf/8438; exp-compounding-spec 10.57967/hf/8454;
#   exp-cross-domain-primacy 10.57967/hf/8456; exp-thinking-primacy 10.57967/hf/8457;
#   exp-temporal-stability 10.57967/hf/8455
retained_internal:
  - paper.md
  - SPINE/ONTOLOGY/PENDING

