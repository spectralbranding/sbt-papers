methodology:
  type: mixed
  design: 'Two-panel version-floor pipeline: the eight-dimension render+extract prompts, byte-identical
    across epochs, run under cross-family operator pairs on both the byte-identical pinned panel and the
    freshly re-collected live panel, at each version epoch. Velocity + floor-clearance estimator: live
    displacement between consecutive epochs; the version floor as the pinned inter-epoch distance for
    the same pair; floor-cleared velocity by removing the pinned-drift component; signal-to-noise as displacement
    over floor; all with source-cluster bootstrap CIs. Dissociation test: per-dimension live motion vs
    pinned version drift compared as a two-set (artifact-anchored vs prior-dependent) by two-source (live
    vs pinned) interaction contrast, Holm-corrected, with the interaction effect size and CI.'
  analysis:
    software: prism-t-velocity/code/ (planned; PL4 estimator published at submission)
acceptance:
- claim_id: P1
  criterion: Holds if A raw multi-epoch change in an LLM-observer brand reading confounds brand-signal
    change with model-version apparatus drift; neither a kinematic calculus of perception nor a single-epoch
    version-robustness result alone licenses a claim that a brand moved.
  falsification: If cross-version re-reads of a fixed panel never differ, there is no apparatus confound
    and P1 is vacuous.
- claim_id: P2
  criterion: Holds if motion is credited only when live-panel displacement clears the contemporaneous
    version floor for the same epoch pair (nesting operator floor within version floor); a claim that
    fails its floor abstains rather than being rescued by an auxiliary argument.
  falsification: If a displacement below the version floor is nonetheless shown to be genuine brand signal
    by an independent measure, the clearance rule is too strict.
- claim_id: P3
  criterion: 'Holds if under the floor-clearance rule, spectral velocity (the floor-cleared live displacement
    between two epochs, in one-minus-cosine distance) is an estimable apparatus-corrected quantity, and
    both outcomes are informative: a cleared velocity is a measured brand motion, a null is a measured
    upper bound on perceptual velocity relative to apparatus drift over the cadence.'
  falsification: If floor-cleared velocity cannot be estimated with a finite bootstrap CI at the panel
    size, P3 fails on precision grounds (power analysis).
- claim_id: P4
  criterion: Holds if on a fixed artifact, a model reading contributes most where the reading leans on
    model priors beyond the displayed text and least where it is anchored in what the artifact literally
    shows; therefore a model-version update (which changes parametric priors) concentrates apparatus drift
    on prior-dependent dimensions, while a real-world event (which changes the artifacts) concentrates
    real motion on artifact-anchored dimensions.
  falsification: If apparatus drift is dimension-flat, or concentrates on artifact-anchored dimensions,
    the mechanism is wrong.
- claim_id: P5
  criterion: 'Holds if the mechanism predicts a double dissociation: live brand motion loads the artifact-anchored
    set (Semiotic, Narrative, Experiential) and pinned version drift loads the prior-dependent set (Ideological,
    Cultural, Social, Temporal, Economic); this joint pattern identifies brand signal from apparatus drift
    more strongly than either floor alone.'
  falsification: If the two-set by two-source interaction is null, or the loadings do not separate by
    set, the dissociation fails.
