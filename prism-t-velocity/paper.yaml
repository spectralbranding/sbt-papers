meta:
  title: 'Floor-Cleared Brand Velocity: Measuring Multi-Epoch Spectral Velocity Against the Apparatus
    Floor'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21192878
  date: '2026-09-17'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - brand velocity
  - longitudinal measurement
  - large language models
  - model-version drift
  - noise floor
  - preregistration
  - double dissociation
  - spectral profile
  abstract: 'A raw multi-epoch reading change from a large language model brand instrument confounds brand
    motion with model-version apparatus drift: a re-measured profile may move because the brand changed
    or because the reader did. This paper introduces floor-cleared brand velocity, a pre-registered measurement
    crediting spectral velocity only when a brand''s live-panel displacement across two epochs exceeds
    the contemporaneous apparatus floor from a byte-identical pinned panel re-read across the epoch pair.
    It further pre-registers a motion-drift double dissociation over a partition fixed ex ante. Forty
    brands were read at two epochs 77 days apart. Mean live-panel displacement of .00560 gives an aggregate
    ratio of 1.916 (bootstrap lower bound 1.534), so the typical brand does not clear the threshold of
    two, and the dissociation interaction is null on both pairs. The brand signal is positive with intervals
    excluding zero under both metrics. Six of 40 brands clear the floor at the pre-registered threshold,
    meeting HV1''s existence criterion, though five sit below the .0162 minimum detectable effect and
    the interval rests on two operator families. No vendor version shipped inside the window, so the floor
    the six cleared is apparatus non-determinism rather than version drift, and the correction is demonstrated
    against the wrong quantity.'
