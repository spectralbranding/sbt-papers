spine_version: "0.2"
spine_doc_version: "0.1.0"
paper_key: "2026be"                  # assigned on main 2026-07-04 (post-gate); slug prism-t-velocity
provenance_mode: pre_registration
title: >-
  Floor-Cleared Brand Velocity: Measuring Multi-Epoch Spectral Velocity Against the
  Apparatus Floor
thesis: |
  A raw multi-epoch reading change from an LLM-observer brand instrument confounds real brand
  motion with model-version apparatus drift. Building on the PRISM-T version floor (a
  byte-identical pinned panel re-read across model versions isolates apparatus drift) and the
  spectral-dynamics calculus (velocity as the first time derivative of the eight-dimension
  reading), this paper measures spectral velocity across two live epochs under a no-rescue
  floor-clearance rule: a brand is credited with real movement only when its live-panel
  displacement exceeds the contemporaneous version floor for the same epoch pair. It further
  derives, and tests, a motion-drift double dissociation — real brand motion loads the
  artifact-anchored dimensions while apparatus drift loads the prior-dependent dimensions —
  from a text-based-versus-knowledge-based comprehension mechanism, so the dissociation is a
  derived identification result rather than an assertion. Both outcomes of the velocity test
  are publishable: brands demonstrably move beyond apparatus, or a measured upper bound on
  perceptual velocity relative to instrument drift.

# ============================================================================
# Boundary conditions — when the measurement is well-posed (RENDERED)
# ============================================================================
boundary_conditions:
  - id: C1
    statement: >-
      The epoch cadence is compatible with the perception relaxation timescale (weeks to
      months), so a finite-difference estimate of velocity between two live epochs is
      well-posed and not dominated by measurement noise.
    antecedents: []
    body_sections: ["Method — Cadence and the Relaxation Timescale"]
  - id: C2
    statement: >-
      The perception dynamics over the observation window are smooth (no crisis-driven jumps,
      no dimensional-creation events); velocity is a local tangent quantity on the
      eight-dimension manifold.
    antecedents: []
    body_sections: ["Method — Scope of the Kinematic Claim"]
  - id: C3
    statement: >-
      The calibrated population is public digital English-language artifacts of consumer and
      B2B brands, read by versioned major-API and open-weights model families, over real
      vendor releases only, with byte-identical prompts across epochs.
    antecedents: []
    body_sections: ["Method — Population and Inclusion"]
  - id: C4
    statement: >-
      The motion-drift dissociation holds unless a real-world event is itself value-laden or
      cultural (shifting the prior-dependent dimensions through the artifacts) or a model
      version is retrained on materially new cultural corpora (contaminating the
      artifact-anchored dimensions); these are the pre-registered conditions under which the
      dissociation is expected to fail.
    antecedents: []
    body_sections: ["Method — When the Dissociation Fails"]

# ============================================================================
# Assumption atoms — assumed-without-test premises (RENDERED, but relaxable)
# ============================================================================
assumption_atoms:
  - id: AA1
    statement: >-
      The version floor estimated on the pinned panel for an epoch pair is a valid upper bound
      on the apparatus contribution to the live-panel displacement for the same epoch pair
      (the apparatus acts equivalently on pinned and live inputs).
    type: identification_assumption
    relaxable: true
    relaxation_consequence: >-
      If the apparatus contribution differs between pinned and live inputs, floor subtraction
      under- or over-corrects the velocity estimate; RC2 (leave-one-operator-out) and RC3
      (negative control) bound the size of the violation.
    affects: [P2, P3, M2, F1]
    body_sections: ["Method — Identification Assumptions"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: AA2
    statement: >-
      For the small displacements observed over one epoch pair, the one-minus-cosine distance
      approximates the local tangent metric on the eight-dimension manifold, so the
      finite-difference displacement is a valid velocity estimate.
    type: metric_approximation
    relaxable: true
    relaxation_consequence: >-
      For large displacements the approximation degrades; RC1 (distance-metric robustness,
      Euclidean-embedding vs one-minus-cosine) tests sensitivity.
    affects: [P3, M2]
    body_sections: ["Method — Distance Metric"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: AA3
    statement: >-
      Cross-family operator extraction within an epoch removes format and decoding
      (surface-behavior) apparatus effects, so residual pinned-panel movement across versions
      is attributable to model priors rather than tokenizer or instruction-following changes.
    type: control_assumption
    relaxable: true
    relaxation_consequence: >-
      If format effects survive the cross-family control, they inflate the version floor
      uniformly across dimensions; a dimension-flat drift signature (vs the dimension-structured
      signature of P5) diagnoses this.
    affects: [P4, P5, M1]
    body_sections: ["Method — Operator Control"]
    provenance: {created_by: author, created_at: "2026-07-04"}

# ============================================================================
# Propositions — theoretical / identification claims (RENDERED)
# ============================================================================
propositions:
  - id: P1
    statement: >-
      A raw multi-epoch change in an LLM-observer brand reading confounds brand-signal change
      with model-version apparatus drift; neither a kinematic calculus of perception nor a
      single-epoch version-robustness result alone licenses a claim that a brand moved.
    type: ontological
    conditions: "C3"
    antecedents: []
    evidence:
      - type: citation
        anchor: "LLM behavior drifts across releases, so a re-measured reading may move because the model changed."
        citation_keys: [chen-2024-chatgpt-behavior-changing]
        citation_role: motivating_problem
      - type: citation
        anchor: "The dynamics calculus supplies velocity/acceleration but is illustrated, not measured; the version-floor instrument is single-epoch."
        citation_keys: [zharnikov-2026z-spectral-dynamics, zharnikov-2026ba-prism-t-version-floor]
        citation_role: theoretical_predecessor
    falsifier: "If cross-version re-reads of a fixed panel never differ, there is no apparatus confound and P1 is vacuous."
    body_sections: ["Introduction — The Confound"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: P2
    statement: >-
      Motion is credited only when live-panel displacement clears the contemporaneous version
      floor for the same epoch pair (nesting operator floor within version floor); a claim that
      fails its floor abstains rather than being rescued by an auxiliary argument.
    type: ontological
    conditions: "C3"
    antecedents: [P1]
    assumptions: [AA1]
    evidence:
      - type: citation
        anchor: "Nested noise floors with no-rescue abstention; the version floor is the temporal member of the nest."
        citation_keys: [zharnikov-2026ay-substrate-floor, zharnikov-2026ax-brand-spectrometer, zharnikov-2026ba-prism-t-version-floor]
        citation_role: theoretical_predecessor
    falsifier: "If a displacement below the version floor is nonetheless shown to be genuine brand signal by an independent measure, the clearance rule is too strict."
    body_sections: ["Theory — The Floor-Clearance Rule for Motion"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: P3
    statement: >-
      Under the floor-clearance rule, spectral velocity (the floor-cleared live displacement
      between two epochs, in one-minus-cosine distance) is an estimable apparatus-corrected
      quantity, and both outcomes are informative: a cleared velocity is a measured brand
      motion, a null is a measured upper bound on perceptual velocity relative to apparatus
      drift over the cadence.
    type: measurement_result
    conditions: "C1, C2, C3"
    antecedents: [P2]
    assumptions: [AA2]
    evidence:
      - type: citation
        anchor: "Velocity as the first time derivative of the spectral profile."
        citation_keys: [zharnikov-2026z-spectral-dynamics]
        citation_role: definitional_source
      - type: citation
        anchor: "The one-minus-cosine brand-space distance the displacement is measured in."
        citation_keys: [zharnikov-2026-brand-space-geometry-formal-metric]
        citation_role: methodological_source
    ruled_out_rivals: [A1]
    falsifier: "If floor-cleared velocity cannot be estimated with a finite bootstrap CI at the panel size, P3 fails on precision grounds (power analysis)."
    body_sections: ["Theory — Floor-Cleared Velocity"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: P4
    statement: >-
      On a fixed artifact, a model reading contributes most where the reading leans on model
      priors beyond the displayed text and least where it is anchored in what the artifact
      literally shows; therefore a model-version update (which changes parametric priors)
      concentrates apparatus drift on prior-dependent dimensions, while a real-world event
      (which changes the artifacts) concentrates real motion on artifact-anchored dimensions.
    type: ontological
    conditions: "C4"
    antecedents: []
    assumptions: [AA3]
    evidence:
      - type: analytic
        anchor: "Derived from a text-based-vs-knowledge-based account of reading comprehension applied to the eight-dimension readout; see HV3_MECHANISM.md."
      - type: citation
        anchor: "Comprehension combines a text-based representation with a knowledge-based (inferential) one; dimensions differ in reliance on each."
        citation_keys: [kintsch-1988-construction-integration, mckoon-1992-inference-during-reading]
        citation_role: theoretical_predecessor
      - type: citation
        anchor: "In LLMs, version/post-training updates shift parametric knowledge and value expression while context-anchored extraction is comparatively stable."
        citation_keys: [petroni-2019-language-models-knowledge-bases, longpre-2021-entity-knowledge-conflicts, ouyang-2022-training-language-models]
        citation_role: theoretical_predecessor
    falsifier: "If apparatus drift is dimension-flat, or concentrates on artifact-anchored dimensions, the mechanism is wrong."
    body_sections: ["Theory — Why Dimensions Differ in Version Sensitivity"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: P5
    statement: >-
      The mechanism predicts a double dissociation: live brand motion loads the
      artifact-anchored set (Semiotic, Narrative, Experiential) and pinned version drift loads
      the prior-dependent set (Ideological, Cultural, Social, Temporal, Economic); this joint
      pattern identifies brand signal from apparatus drift more strongly than either floor
      alone.
    type: measurement_result
    conditions: "C3, C4"
    antecedents: [P4, P2]
    evidence:
      - type: analytic
        anchor: "Direct prediction of P4 crossed with the version-floor decomposition; the dimension partition is fixed ex ante (not fit to data)."
    ruled_out_rivals: [A2, A3]
    falsifier: "If the two-set by two-source interaction is null, or the loadings do not separate by set, the dissociation fails."
    body_sections: ["Theory — The Motion-Drift Double Dissociation"]
    provenance: {created_by: author, created_at: "2026-07-04"}

# ============================================================================
# Methods — planned procedural nodes (RENDERED; result-bearing outputs PLANNED)
# ============================================================================
methods:
  - id: M1
    statement: >-
      Two-panel version-floor pipeline: the eight-dimension render+extract prompts, byte-identical
      across epochs, run under cross-family operator pairs on both the byte-identical pinned panel
      and the freshly re-collected live panel, at each version epoch.
    type: ai_invocation
    inputs: [O1, O2]
    outputs: [m1, m2]
    code_anchor: "prism-t-velocity/code/ (planned; PL4 estimator published at submission)"
    reproducibility: {seed: "temperature 0 where honored; append-only JSONL", version: "prism-t/v1.0.0 prompts"}
    body_sections: ["Method — Instrument"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: M2
    statement: >-
      Velocity + floor-clearance estimator: live displacement between consecutive epochs; the
      version floor as the pinned inter-epoch distance for the same pair; floor-cleared velocity
      by removing the pinned-drift component; signal-to-noise as displacement over floor; all
      with source-cluster bootstrap CIs.
    type: computation
    inputs: [m1, m2]
    outputs: [F1]
    code_anchor: "prism-t-velocity/code/estimator (planned; fixed seed, PAQS 37a-37e)"
    reproducibility: {seed: "fixed (published at submission)", version: "planned"}
    body_sections: ["Method — Velocity Estimator"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: M3
    statement: >-
      Dissociation test: per-dimension live motion vs pinned version drift compared as a
      two-set (artifact-anchored vs prior-dependent) by two-source (live vs pinned) interaction
      contrast, Holm-corrected, with the interaction effect size and CI.
    type: statistical_analysis
    inputs: [m1, m2]
    outputs: [F2]
    body_sections: ["Method — Dissociation Test"]
    provenance: {created_by: author, created_at: "2026-07-04"}
  - id: M4
    statement: >-
      Power simulation (feasible now, no new data): given operator floors in the .0034-.057
      range and version floors below .03, the minimum detectable velocity magnitude at
      signal-to-noise above 2 for the 40-brand by 4-artifact panel, and the power of the M3
      interaction; if power is below 80% for a medium dimension-set effect, plan >= 60 brands.
    type: simulation
    inputs: []
    outputs: [F3]
    code_anchor: "prism-t-velocity/code/power_analysis (planned)"
    reproducibility: {seed: "fixed", version: "planned"}
    body_sections: ["Method — Power"]
    provenance: {created_by: author, created_at: "2026-07-04"}

