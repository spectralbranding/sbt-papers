# ============================================================================
# Limitations & negative findings (RENDERED)
# ============================================================================
limitations:
  - id: L1
    statement: "Opportunistic two-epoch cadence: velocity only (no acceleration; that is the deferred follow-up), and the epoch interval is set by real vendor timing within the relaxation-window guideline."
    affects: [F1, P3]
    severity: medium
    mitigation: "Cadence pre-registered against the relaxation timescale (C1); acceleration held for the follow-up once VE-3 exists."
    provenance: {created_by: author, created_at: "2026-07-04"}
    body_sections: ["Limitations"]
  - id: L2
    statement: "A small version floor at the current epoch lowers the clearance bar; the floor is re-estimated per epoch pair rather than fixed, but a near-null floor limits how strong a no-rescue demonstration the data can carry."
    affects: [P2, F1]
    severity: low
    mitigation: "Report the floor magnitude with its CI at each epoch pair; the positive control (distant-version pair) demonstrates estimator sensitivity."
    provenance: {created_by: author, created_at: "2026-07-04"}
    body_sections: ["Limitations"]
  - id: L3
    statement: "A single eight-dimension instrument on brands; transfer to other multidimensional-perception domains is untested here."
    affects: [P3, P5]
    severity: medium
    mitigation: "Frame the contribution as the version-floor correction enabling longitudinal LLM-observer measurement; a non-brand demonstration is noted as future work."
    provenance: {created_by: author, created_at: "2026-07-04"}
    body_sections: ["Limitations", "Discussion — Generalization"]
negative_findings:
  - id: NF1
    statement: "No existing LLM-observer longitudinal brand study reports a version-floor-corrected velocity; the prior version-stability spot-check was unfloored and profile-level."
    expected_observation: "A published apparatus-corrected brand-velocity estimate."
    source_method: "corpus + external literature review"
