    note: >-
      R2's static metameric loss is extended to dynamics: scalar projections of
      X_t lose velocity, drift, and boundary-proximity information.
  - paper_key: 2026f
    relationship: extends
    spine_nodes: [P3]
    note: >-
      R3's fuzzy cohort boundaries gain a dynamical mechanism — observers drift
      between cohorts at rate sigma_0, making cohort membership stochastic.
  - paper_key: 2026k
    relationship: applies
    spine_nodes: [P6]
    note: >-
      The Goldilocks zone supplies R7 the prior question — what fraction of
      signal budget should be designed vs ambient — beneath R7's allocation of
      the designed direction.
  - paper_key: 2026o
