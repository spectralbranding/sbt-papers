    note: >-
      R1's geometry (Aitchison metric, Fisher-Rao, octant volume pi^4/768, the
      spectral sensitivity index) is taken as given; R6 adds the dynamics that
      evolve states within that metric structure (its dynamical completion).
  - paper_key: 2026e
    relationship: extends
